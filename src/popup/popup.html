<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fidelitone</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body data-connection-state="disconnected">
    <div class="popup-shell">
      <header class="app-header">
        <div>
          <div class="brand">Fidelitone</div>
          <div class="tab-title" id="tabTitle" title="No active tab">No active tab</div>
        </div>
        <div class="connection-summary" id="connectionSummary" role="status" aria-live="polite">
          <span class="status-indicator" aria-hidden="true"></span>
          <span id="connectionText">尚未連線</span>
        </div>
      </header>

      <section class="connection-strip" aria-label="音訊連線">
        <div class="connection-copy">
          <strong id="connectionHeadline">等待開始</strong>
          <span id="connectionDetail">開啟分頁音訊後會自動連線</span>
        </div>
        <button class="compact-button" id="connectBtn" type="button">立即連線</button>
      </section>

      <div class="error-msg" id="errorMsg" role="alert" aria-live="assertive"></div>

      <main>
        <section class="panel pitch-panel control-lock" aria-labelledby="pitchHeading">
          <div class="panel-heading">
            <h2 id="pitchHeading">音高</h2>
            <output class="pitch-value" id="pitchValue" aria-live="polite">
              <span id="pitchNumber">+0.00</span><small>st</small>
            </output>
          </div>

          <div class="pitch-control">
            <button class="step-button" id="pitchDown" type="button" aria-label="降低音高">−</button>
            <input
              type="range"
              id="pitchSlider"
              min="-12"
              max="12"
              step="1"
              value="0"
              aria-label="音高調整"
              aria-valuetext="+0.00 semitones"
            />
            <button class="step-button" id="pitchUp" type="button" aria-label="提高音高">+</button>
          </div>

          <label class="option-row">
            <input type="checkbox" id="snapCheckbox" role="switch" checked />
            <span class="switch" aria-hidden="true"></span>
            <span class="option-copy">
              <span class="option-label">半音吸附</span>
              <span class="option-helper">以整數半音調整</span>
            </span>
          </label>
        </section>

        <section class="panel signal-panel control-lock" aria-labelledby="signalHeading">
          <div class="panel-heading">
            <h2 id="signalHeading">信號路徑</h2>
            <span class="route-badge" id="routeBadge">待命</span>
          </div>

          <div class="signal-block">
            <div class="block-label" id="engineHeading">引擎</div>
            <div class="segmented-control" id="engineControl" role="radiogroup" aria-label="處理引擎">
              <button class="segment" id="engineSignalsmith" type="button" role="radio" aria-checked="false" data-engine="signalsmith">
                <span class="segment-name">Signalsmith</span>
                <span class="segment-status" id="signalsmithStatus">待命</span>
              </button>
              <button class="segment" id="engineRubberband" type="button" role="radio" aria-checked="false" data-engine="rubberband">
                <span class="segment-name">RubberBand</span>
                <span class="segment-status" id="rubberbandStatus">待命</span>
              </button>
            </div>
            <p class="panel-note" id="engineNote">連線後可切換處理引擎</p>
          </div>

          <div class="signal-block">
            <div class="block-label" id="modeHeading">處理模式</div>
            <div class="segmented-control" id="modeControl" role="radiogroup" aria-label="處理模式">
              <button class="segment" id="activeMode" type="button" role="radio" aria-checked="true" data-mode="active">
                <span class="segment-name">處理中</span>
                <span class="segment-status">引擎生效</span>
              </button>
              <button class="segment" id="bypassMode" type="button" role="radio" aria-checked="false" data-mode="bypass">
                <span class="segment-name">旁路</span>
                <span class="segment-status">原始音訊</span>
              </button>
            </div>
            <p class="panel-note" id="modeNote">音訊會經過目前引擎</p>
          </div>
        </section>

        <section class="options-panel control-lock" aria-label="進階選項">
          <label class="option-row">
            <input type="checkbox" id="formantCheckbox" role="switch" />
            <span class="switch" aria-hidden="true"></span>
            <span class="option-copy">
              <span class="option-label">共振峰保護</span>
              <span class="option-helper">RubberBand 與 Signalsmith 皆支援</span>
            </span>
          </label>

          <label class="option-row">
            <input type="checkbox" id="accompanimentCheckbox" role="switch" />
            <span class="switch" aria-hidden="true"></span>
            <span class="option-copy">
              <span class="option-label">伴奏模式</span>
              <span class="option-helper">低頻重取樣，高頻 Signalsmith</span>
            </span>
          </label>
        </section>
      </main>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
