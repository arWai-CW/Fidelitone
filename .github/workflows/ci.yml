name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The extension loads worklet modules as classic scripts; a stray
      # `import`/`export` makes the whole file throw a SyntaxError in the page,
      # so assert it here rather than discovering it in a tab.
      - name: Check content scripts stay classic
        run: |
          for f in dist/content.js dist/content-main.js; do
            if grep -qE '(^|[^.$])import[[:space:]]*[{*A-Za-z_"]|export[[:space:]]*[{*]' "$f"; then
              echo "::error file=$f::content script contains import/export and will throw in the page"
              exit 1
            fi
          done

      - name: Verify build output is complete
        run: |
          test -f dist/manifest.json
          test -f dist/popup.html
          test -f dist/offscreen.html
          test -f dist/background.js
          for f in crossover-processor lowband-resampler passthrough-processor signalsmith-stretch; do
            test -f "dist/processors/$f.js" || { echo "::error::missing dist/processors/$f.js"; exit 1; }
          done

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: fidelitone-dist
          path: dist/
          retention-days: 14
